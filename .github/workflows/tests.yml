name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    concurrency:
      group: managed-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: VS Code extension tests
        shell: pwsh
        run: node --test extensions/lucent-lui-vscode/extension.test.cjs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Managed tests
        shell: pwsh
        run: ./tools/Test-Repository.ps1 -Suite Managed
      - name: Summarize managed verification
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          @(
            '## Managed verification'
            '- Result: ${{ job.status }}'
            '- NuGet packages use the setup-dotnet cache keyed by packages.lock.json files.'
            '- Core architecture/public API preflight runs before managed tests; negative fixture proof runs after them.'
            '- VS Code extension contract: node --test extensions/lucent-lui-vscode/extension.test.cjs'
          ) -join [Environment]::NewLine | Add-Content -Path $env:GITHUB_STEP_SUMMARY
  packages:
    concurrency:
      group: lucent-package-publication
      cancel-in-progress: false
    needs: managed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Pack and consume prerelease packages
        shell: pwsh
        run: |
          $version = "0.3.0-dev.${{ github.run_number }}.1"
          ./tools/Test-Repository.ps1 -Suite Native
          ./tools/Pack-Packages.ps1 -Version $version
          ./tools/Verify-LuiAssets.ps1 -Version $version -Feed "artifacts/packages/$version"
          ./tools/Test-HeadlessPackages.ps1 -Version $version -Feed "artifacts/packages/$version"
          ./tools/Test-Packages.ps1 -Version $version -Feed "artifacts/packages/$version"
      - name: Publish immutable package set
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "0.3.0-dev.${{ github.run_number }}.1"
          $source = 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json'
          $packages = @(./tools/Get-PackageSet.ps1 -Directory "artifacts/packages/$version" -Version $version)
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:GITHUB_TOKEN --source $source --skip-duplicate
            if ($LASTEXITCODE) { throw "Package publish failed: $($package.Name)" }
          }
          "Published Lucent $version from ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
