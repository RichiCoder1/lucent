name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    concurrency:
      group: managed-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-2025
    # CI106 reached the final managed suite at 24 minutes; allow final checks and cache cleanup.
    timeout-minutes: 40
    outputs:
      verification-artifact-id: ${{ steps.upload-managed.outputs.artifact-id }}
      verification-artifact-digest: ${{ steps.upload-managed.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: VS Code extension tests
        shell: pwsh
        run: node --test extensions/lucent-lui-vscode/extension.test.cjs extensions/lucent-lui-vscode/server-bundle.test.cjs extensions/lucent-lui-vscode/server-cache.test.cjs extensions/lucent-lui-vscode/server-acquisition.test.cjs extensions/lucent-lui-vscode/managed-tool.test.cjs extensions/lucent-lui-vscode/doctor-client.test.cjs extensions/lucent-lui-vscode/onboarding-ui.test.cjs extensions/lucent-lui-vscode/environment-ui.test.cjs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Managed tests
        shell: pwsh
        run: ./tools/Test-ReleaseChecks.ps1 -Suite Managed
      - name: Upload managed test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-trx-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test/managed/**/*.trx
          if-no-files-found: warn
          retention-days: 5
          compression-level: 0
      - name: Upload successful managed verification
        id: upload-managed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-managed/
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      - name: Summarize managed verification
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          @(
            '## Managed verification'
            '- Result: ${{ job.status }}'
            '- NuGet packages use the setup-dotnet cache keyed by packages.lock.json files.'
            '- Core architecture/public API preflight runs before managed tests; negative fixture proof runs after them.'
            '- VS Code extension contract: node --test extensions/lucent-lui-vscode/*.test.cjs'
          ) -join [Environment]::NewLine | Add-Content -Path $env:GITHUB_STEP_SUMMARY
  package-verify:
    concurrency:
      group: package-verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    # CI105 finished verification/upload at 28 minutes, then timed out saving NuGet cache.
    timeout-minutes: 40
    outputs:
      package-artifact-id: ${{ steps.upload-packages.outputs.artifact-id }}
      package-artifact-digest: ${{ steps.upload-packages.outputs.artifact-digest }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Verify prerelease inputs and package consumers
        shell: pwsh
        run: |
          $version = "0.3.0-dev.${{ github.run_number }}.1"
          ./tools/Test-ReleaseChecks.ps1 -Suite Packages -Version $version
      - name: Upload verified release inputs
        id: upload-packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packages/0.3.0-dev.${{ github.run_number }}.1/
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  publish:
    concurrency:
      group: lucent-package-publication
      cancel-in-progress: false
    needs: [managed, package-verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Download verified package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-verify.outputs.package-artifact-id }}
          path: artifacts/packages/0.3.0-dev.${{ github.run_number }}.1
          merge-multiple: true
          digest-mismatch: error
      - name: Download managed verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.managed.outputs.verification-artifact-id }}
          path: artifacts/release-managed
          merge-multiple: true
          digest-mismatch: error
      - name: Complete verified release descriptor
        shell: pwsh
        env:
          INPUT_ARTIFACT_ID: ${{ needs.package-verify.outputs.package-artifact-id }}
          INPUT_ARTIFACT_DIGEST: ${{ needs.package-verify.outputs.package-artifact-digest }}
          MANAGED_ARTIFACT_ID: ${{ needs.managed.outputs.verification-artifact-id }}
          MANAGED_ARTIFACT_DIGEST: ${{ needs.managed.outputs.verification-artifact-digest }}
        run: |
          $directory = "artifacts/packages/0.3.0-dev.${{ github.run_number }}.1"
          ./tools/Complete-ReleaseSet.ps1 -CandidatePath "$directory/candidate.json" `
            -ArtifactDirectory $directory -ManagedArtifactDirectory artifacts/release-managed `
            -InputArtifactId $env:INPUT_ARTIFACT_ID -InputArtifactDigest $env:INPUT_ARTIFACT_DIGEST `
            -ManagedArtifactId $env:MANAGED_ARTIFACT_ID -ManagedArtifactDigest $env:MANAGED_ARTIFACT_DIGEST `
            -OutputPath "$directory/complete.json"
      - name: Upload complete release descriptor and inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packages/0.3.0-dev.${{ github.run_number }}.1/
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      - name: Publish immutable package set
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "0.3.0-dev.${{ github.run_number }}.1"
          $source = 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json'
          $packages = @(./tools/Get-PackageSet.ps1 -Directory "artifacts/packages/$version" -Version $version)
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:GITHUB_TOKEN --source $source --skip-duplicate
            if ($LASTEXITCODE) { throw "Package publish failed: $($package.Name)" }
          }
          "Published Lucent $version from ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
